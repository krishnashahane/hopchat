name: Refresh audited dependency lockfile

on:
  push:
    branches: [fix/ci-readme-hardening]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-readme-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compatible security updates
        run: npm audit fix --ignore-scripts
      - name: Confirm remaining high-severity audit findings
        run: npm audit --audit-level=high
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-audit.yml
          git add package.json package-lock.json
          git commit -m "security: refresh vulnerable transitive dependencies"
          git push origin HEAD:fix/ci-readme-hardening
